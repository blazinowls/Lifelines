name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Add the AdMob app ID (Google test ID until you replace it)
        run: |
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4441564159986722~6530621382"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK (for testing on your phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lifelines-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK (only when keystore secrets are set)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android && ./gradlew assembleRelease
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          OUT=app/build/outputs/apk/release
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$OUT/app-release-unsigned.apk" "$OUT/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out "$OUT/lifelines-release.apk" "$OUT/aligned.apk"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: lifelines-release-apk
          path: android/app/build/outputs/apk/release/lifelines-release.apk
