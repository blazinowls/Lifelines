<style>
:root{--bg:#f6f0e4;--surface:#fffaf0;--ink:#2b2a26;--mute:#7b7566;--line:#e4dac3;--accent:#1f6f6b;--accent-ink:#fff;--warn:#b5472c;
--c-health:#c4513b;--c-happy:#d99a1c;--c-smarts:#3d7ab5;--c-looks:#9a5db0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a17;--surface:#262420;--ink:#f1ebdc;--mute:#a49d8b;--line:#3a362e;--accent:#4fb5ae;--accent-ink:#10211f;--warn:#e47a5f}}
:root[data-theme="dark"]{--bg:#1b1a17;--surface:#262420;--ink:#f1ebdc;--mute:#a49d8b;--line:#3a362e;--accent:#4fb5ae;--accent-ink:#10211f;--warn:#e47a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0}
.sub{color:var(--mute);font-size:14px}
.money{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.st{font-size:12px;color:var(--mute)}
.bar{height:8px;border-radius:5px;background:var(--line);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
#log{flex:1;overflow-y:auto;padding:12px 16px}
.yr{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:13px;color:var(--accent);margin:14px 0 4px;letter-spacing:.04em}
.ln{margin:0 0 5px;line-height:1.4;font-size:15px}
footer{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--bg)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;padding:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:13px;padding:14px 9px}
.btn:disabled{opacity:.45}
#age{flex:1}
.modal{position:fixed;inset:0;background:rgba(15,12,5,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:Fraunces,Georgia,serif;font-size:21px;margin:0 0 6px}
.sheet p{margin:0 0 14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:8px;cursor:pointer}
.opt small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.opt:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg)}
.up{color:var(--accent)}.dn{color:var(--warn)}
</style>
</head>

<div id="app">
  <header>
    <div class="row"><h1 id="name"></h1><span class="money" id="money"></span></div>

    <div class="stats" id="stats"></div>
  </header>
  <div id="log"></div>
  <footer>
    <button class="btn alt" id="act">Activities</button>
    <button class="btn alt" id="ppl">People</button>
    <button class="btn alt" id="skl">Skills</button>
    <button class="btn" id="age">Age up</button>
  </footer>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

function ord(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th')}
function busy(){return $('modal').classList.contains('on')}

function spend(n){
  if(G.age<18){G.money=Math.max(0,G.money-n);return}
  if(G.money>=n){G.money-=n;return}
  var s=n-G.money;G.money=0;
  var use=Math.min(s,Math.max(0,(G.cl||0)-(G.debt||0)));G.debt=(G.debt||0)+use;s-=use;
  if(s>0){var fee=Math.round(s*.05);G.debt+=s+fee;G.cl=0;G.happy=clamp(G.happy-3);say('You could not cover '+fmt(s)+' in bills. The bank added '+fmt(fee)+' in overdraft fees and froze your credit line.')}
}
function apply(fx){var o=[];for(var k in fx){var v=fx[k];if(!v)continue;if(k==='money'){if(v>0)G.money+=v;else spend(-v)}else G[k]=clamp(G[k]+v);o.push({k:k,v:v})}return o}
function chips(a){return'<div class="chips">'+a.map(function(c){return'<span class="chip '+(c.v>0?'up':'dn')+'">'+LBL[c.k]+' '+(c.k==='money'?(c.v>0?'+':'')+fmt(c.v):(c.v>0?'+':'')+c.v)+'</span>'}).join('')+'</div>'}

/* ---------- modal helpers ---------- */
function ask(title,body,opts){
  $('sheet').innerHTML='<h2>'+title+'</h2><p>'+body+'</p>';
  opts.forEach(function(o){
    var b=document.createElement('button');b.className='opt';
    b.innerHTML=o.l+(o.s?'<small>'+o.s+'</small>':'');
    if(o.dis)b.disabled=true;
    b.onclick=o.go;$('sheet').appendChild(b);
  });
  $('modal').classList.add('on');
}
function result(text,fx,done){
  var c=apply(fx||{});say(text);
  $('sheet').innerHTML='<h2>'+text+'</h2>'+chips(c);
  var b=document.createElement('button');b.className='btn';b.style.width='100%';b.textContent='Continue';
  b.onclick=function(){$('modal').classList.remove('on');if(done)done()};
  $('sheet').appendChild(b);render();save();
}

    if((j[4].health||0)!==0&&chance(.03)){fx.health=-4;t+=' You hurt your back.'}
    if(j[0]==='Do chores at home'){var ps=G.people.filter(function(p){return!p.dead&&(p.t==='Mother'||p.t==='Father')});if(ps.length){var q=pick(ps);q.b=Math.min(100,q.b+3)}}
    result(t,fx)}}});
  L.push({l:'Never mind',go:function(){G.ap++;$('modal').classList.remove('on')}});
  ask('Odd jobs','Pick a job. This uses your monthly activity.',L);
}
function bankCap(){return Math.max(1,(G.salary||0)*2+G.money+Math.max(0,(G.homeVal||0)-(G.mort||0)))}
function bankP(amt){var p=.55+G.smarts/500+(G.salary>0?.1:-.2)-(G.record||0)*.12-((G.debt||0)+amt)/bankCap()*.5;return Math.max(.05,Math.min(.95,p))}
function bankPage(){
  var now=G.age*12+G.month,cool=(G.bankCool||0)>now,cl=G.cl||0;
  var lim=Math.min(100000,Math.max(1000,Math.round(bankCap()*.3/500)*500));
  var deny=function(){G.bankCool=now+6;result('The bank denied your request. You can apply again in 6 months.',{happy:-3})};
  var L=[{l:'Apply for a credit line',s:cl?'Current limit: '+fmt(cl):'Lets you cover bills without overdraft fees',dis:cool,go:function(){
    if(chance(bankP(lim*.5))){G.cl=Math.max(cl,lim);result('The bank approved a credit line of '+fmt(G.cl)+'.',{})}else deny()}}];
  [1000,5000,20000,50000].forEach(function(a){L.push({l:'Request a '+fmt(a)+' loan',s:'Paid into your bank balance, adds to debt',dis:cool,go:function(){
    if(chance(bankP(a))){G.money+=a;G.debt=(G.debt||0)+a;result('The bank approved your '+fmt(a)+' loan.',{})}else deny()}})});
  L.push({l:'Close',go:function(){$('modal').classList.remove('on')}});
  ask('Bank','Credit limit '+fmt(cl)+' \u00b7 Debt '+fmt(G.debt||0)+(cool?' \u00b7 Recently denied':'')+'. Spending past your balance and credit means fees and a frozen credit line.',L);
}
/* ---------- diet, courses and camps ---------- */
var DIET=[['Instant noodles',60,-.5,-.3,-.2,0],['Budget groceries',200,0,0,0,0],['Fast food',300,-.4,.3,-.2,0],['Balanced home cooking',450,.25,.1,.1,0],['Athlete meal plan',800,.5,0,.3,.05],['Gourmet chef-prepared meals',1500,.2,.6,.3,0]];
function dIdx(){return G.diet==null?1:G.diet}
function dietPage(){
  var L=DIET.map(function(d,i){
    var fx=[['Health',d[2]],['Happy',d[3]],['Looks',d[4]],['Smarts',d[5]]].filter(function(e){return e[1]}).map(function(e){return e[0]+(e[1]>0?' up':' down')}).join(', ')||'No effect';
    var dc=d[1]-200;
    return{l:d[0]+(i===dIdx()?' (current)':''),s:(G.age>=18?(dc===0?'Baseline cost':(dc>0?'+':'-')+fmt(Math.abs(dc))+'/month')+' \u00b7 ':'Parents pay \u00b7 ')+fx,go:function(){G.diet=i;result('You switched to '+d[0].toLowerCase()+'.',{})}};
  });
  L.push({l:'Close',go:function(){$('modal').classList.remove('on')}});
  ask('Diet','What you eat nudges your stats every month. Cheaper plans save money but cost you health and looks.',L);
}
function skillPicker(kind){
  var cost=kind==='course'?300:1500;
  var L=SK.map(function(s){var x=lv(s[0]);return{l:s[0],s:s[1]+' \u00b7 '+lvName(x)+' \u00b7 '+x+'/100',dis:G.money<cost,go:function(){train(s[0],s[1],kind,cost)}}});
  L.push({l:'Back',go:function(){$('modal').classList.remove('on');skillsPage()}});
  ask(kind==='course'?'Short course':'Training camp',(kind==='course'?'A short course costs '+fmt(cost)+' and boosts a skill a lot.':'A training camp costs '+fmt(cost)+' and boosts a skill hugely.')+(G.money<cost?' You need more money in the bank.':''),L);
}
function train(n,cat,kind,cost){
  G.ap--;G.skills=G.skills||{};G.apt=G.apt||{};
  if(!G.apt[n])G.apt[n]=.7+Math.random()*.7;
  var x=lv(n),g=Math.round((kind==='course'?rnd(9,13):rnd(22,30))*G.apt[n]);
  if((kind==='course'&&x>=60)||x>=80)g=Math.ceil(g/2);
  g=Math.max(2,g);
  G.skills[n]=Math.min(100,(G.skills[n]||0)+g);
  var fx={money:-cost};
  if(kind==='camp'){if(cat==='Sport'){fx.health=-3;fx.happy=3}else if(cat==='Music')fx.happy=4;else{fx.smarts=2;fx.happy=2}}else fx.smarts=1;
  var t='You '+(kind==='course'?'took a short '+n.toLowerCase()+' course':'joined a '+n.toLowerCase()+' training camp')+' and improved by '+g+'.';
  if(lvName(lv(n))!==lvName(x))t+=' You are now '+lvName(lv(n)).toLowerCase()+'.';
  result(t,fx);
}
/* ---------- crime and risk ---------- */
var CR=[['Shoplift',14,30,250,.25,300,0,0],['Pickpocket',14,50,400,.3,500,0,1],['Vandalism',14,0,0,.3,800,0,2],['Steal a car',16,2000,8000,.45,3000,6,24],['Burglary',16,1500,6000,.4,2000,6,18],['Online fraud',18,3000,20000,.3,5000,6,24],['Embezzle from work',18,5000,40000,.3,10000,12,36],['Rob a bank',18,40000,150000,.7,20000,48,96]];
function crimeOutcome(c){
  var p=Math.max(.05,Math.min(.9,c[4]-G.smarts/500-(T('Lucky')?.05:0)+(G.record?.05*Math.min(G.record,4):0))),fx={};
  if(chance(p)){
    var m=rnd(c[6],c[7]);if(G.age<18)m=Math.min(m,6);
    G.record=(G.record||0)+1;fx.money=-c[5];fx.happy=-8;if(m>0)G.jail=m;
    if(c[0]==='Embezzle from work'){G.job=null;G.salary=0;G.track=null}
    return{t:'You were caught for '+c[0].toLowerCase()+'. You paid a fine of '+fmt(c[5])+(m>0?' and were sentenced to '+m+' months in '+(G.age<18?'juvenile detention':'prison')+'.':'.')+' You now have a criminal record.',fx:fx};
  }
  var r=c[2]?rnd(c[2],c[3]):0;if(r)fx.money=r;fx.happy=c[2]?3:6;
  return{t:'You got away with it.'+(r?' You made '+fmt(r)+'.':''),fx:fx};
}
function crimeMenu(){
  var L=CR.filter(function(c){return G.age>=c[1]&&(c[0]!=='Embezzle from work'||G.job)}).map(function(c){return{l:c[0],s:c[2]?'Reward '+fmt(c[2])+' to '+fmt(c[3]):'No reward, just thrills',go:function(){var o=crimeOutcome(c);result(o.t,o.fx)}}});
  L.push({l:'Never mind',go:function(){G.ap++;$('modal').classList.remove('on')}});
  ask('Do something illegal','High risk. Getting caught means a fine, a record, and maybe prison. A record hurts job interviews.',L);
}
/* ---------- skills ---------- */
var SK=[['Basketball','Sport'],['Soccer','Sport'],['Football','Sport'],['Baseball','Sport'],['Tennis','Sport'],['Swimming','Sport'],['Boxing','Sport'],['Golf','Sport'],['Piano','Music'],['Guitar','Music'],['Violin','Music'],['Drums','Music'],['Saxophone','Music'],['Trumpet','Music'],['Cooking','Other'],['Painting','Other'],['Coding','Other']];
function lv(n){return Math.round((G.skills&&G.skills[n])||0)}
function lvName(x){return x<1?'Never tried':x<20?'Beginner':x<40?'Amateur':x<60?'Skilled':x<80?'Expert':'Elite'}
function skillsPage(){
  if(!G.alive||busy())return;
  var u=!(G.ap>0)||G.age<5;
  var L=SK.map(function(s){var x=lv(s[0]);return{l:s[0],s:s[1]+' · '+lvName(x)+' · '+x+'/100',dis:u,go:function(){practice(s[0],s[1])}}});
  L.unshift({l:'Take a short course',s:'$300 \u00b7 a big boost to one skill',dis:u,go:function(){skillPicker('course')}},{l:'Join a training camp',s:'$1,500 \u00b7 a huge boost to one skill (age 10+)',dis:u||G.age<10,go:function(){skillPicker('camp')}});
  L.push({l:'Close',go:function(){$('modal').classList.remove('on')}});
  ask('Skills',G.age<5?'You are too young to practice yet.':!(G.ap>0)?'You are out of activities this turn. You can still view your levels.':'Tap a skill to practice it. This uses one activity ('+G.ap+' left).',L);
}
function practice(n,cat){
  G.ap--;G.skills=G.skills||{};G.apt=G.apt||{};
  if(!G.apt[n])G.apt[n]=.7+Math.random()*.7;
  var gain=Math.max(1,Math.round(rnd(2,4)*G.apt[n]+(cat==='Sport'&&T('Athletic')?1:0)+(cat==='Other'&&T('Bookish')?1:0)));
  var before=lv(n);G.skills[n]=Math.min(100,(G.skills[n]||0)+gain);
  var fx=cat==='Sport'?{health:2}:cat==='Music'?{happy:2}:{smarts:1,happy:1};
  var t='You practiced '+n.toLowerCase()+' and improved by '+gain+'.';
  if(lvName(lv(n))!==lvName(before))t+=' You are now '+lvName(lv(n)).toLowerCase()+'.';
  if(cat==='Sport'&&chance(.05)){fx={health:-5};t+=' You got injured.'}
  result(t,fx);
}
function skillEvent(done){
  var ok=SK.filter(function(s){return lv(s[0])>=20});
  if(!ok.length||G.jail>0)return false;
  var s=pick(ok),n=s[0],x=lv(n),cat=s[1];
  var what=cat==='Sport'?'a local '+n.toLowerCase()+' tournament':cat==='Music'?'an open-mic night':'a local contest';
  var p=Math.max(.1,Math.min(.9,.2+x/120)),prize=cat==='Sport'?100+x*20:cat==='Music'?80+x*15:60+x*10;
  ask('Your skills','You are invited to '+what+' to show off your '+n.toLowerCase()+'.',[
    {l:'Enter',s:'Your odds depend on your '+n.toLowerCase()+' level',go:function(){
      if(chance(p)){G.skills[n]=Math.min(100,x+2);result('You shone at '+what+' and won '+fmt(prize)+'.'+(chance(.3)?sit(true):''),{money:prize,happy:8},done)}
      else result('You entered '+what+' but fell short.',cat==='Sport'?{happy:-3,health:-3}:{happy:-4},done)}},
    {l:'Decline',go:function(){result('You skipped it.',{happy:-1},done)}}]);
  return true;
}
/* ---------- activities ---------- */
function activities(){
  if(!G.alive||busy())return;
  if(G.jail>0)return ask('In prison','You are serving time. '+G.jail+' months left.',[{l:'Close',go:function(){$('modal').classList.remove('on')}}]);
  var u=!(G.ap>0);
  var o=actList();
  if(G.age>=13&&G.age<=18)o.push({l:'Do chores or odd jobs',s:'Earn pocket money from locals',odd:1});
  if(G.age>=18&&!G.college&&!G.retired)o.push({l:'Job hunt',s:'See 5 openings and interview',job:1});
  var L=o.map(function(x){return{l:x.l,s:x.s,dis:u,go:function(){
    G.ap--;
    if(x.job)return jobHunt();if(x.odd)return oddJobs();
    var t=x.r,fx=Object.assign({},x.fx);
    if(T('Athletic')&&fx.health)fx.health+=2;if(T('Bookish')&&fx.smarts)fx.smarts+=2;
    if(x.friend&&chance(T('Charming')?.55:T('Shy')?.2:.35)){var f=person('Friend',null,45);G.people.push(f);t+=' You made a new friend, '+f.n+'.'}
    result(t,fx);
  }}});
  L.push({l:'Close',go:function(){$('modal').classList.remove('on')}});
  if(G.age>=8&&G.people.some(function(p){return!p.dead&&(p.t==='Mother'||p.t==='Father')}))L.push({l:'Ask your parents for money',s:'Depends on your bond with them',go:askParents});
  if(G.age>=18)L.push({l:'Visit the bank',s:'Credit line and loans (needs approval)',go:bankPage});
  if(G.age>=13)L.push({l:'Choose your diet',s:'Current: '+DIET[dIdx()][0].toLowerCase(),go:dietPage});
  if(G.age>=16)L.push({l:'Do something illegal',s:'Risky: fines, a record, maybe prison',dis:u,go:function(){G.ap--;crimeMenu()}});
  if(!G.adx)L.push({l:'Watch an ad for 2 extra activities',s:'Once per turn',go:function(){AdBridge.showRewarded(function(ok){if(ok){G.adx=1;G.ap+=2;$('modal').classList.remove('on');render();save()}})}});
  if(G.age>=18)L.push({l:'Investments',s:'Stocks, bonds, and crypto',go:investPage});
  if(G.age>=18)L.push({l:'Your business',s:G.biz?G.biz.n+', level '+G.biz.lv:'Start a business ($10,000)',go:bizPage});
  if(G.age>=8)L.push({l:'Adopt a pet',s:'Pets lift your mood',go:petPage});
  if(G.age>=18&&!hasPartner())L.push({l:'Use a dating app',s:'Uses 1 activity',dis:!(G.ap>0),go:function(){G.ap--;dating()}});
  if(G.age>=13)L.push({l:'Post on social media',s:(G.fol||0)+' followers \u00b7 uses 1 activity',dis:!(G.ap>0),go:function(){G.ap--;postSocial()}});
  if(G.age>=18)L.push({l:'Travel',s:'Take a trip. Uses 1 activity.',dis:!(G.ap>0),go:travelPage});
  if(G.age>=13)L.push({l:'Memberships',s:'Gym and wardrobe plans',go:membPage});
  if(G.age>=11&&G.age<=18)L.push({l:'School clubs and teams',s:'Join a club or sports team',go:schoolPage});
  L.push({l:'Achievements',s:Object.keys(ACHV).length+' of '+ACH.length+' unlocked',go:achPage});
  if(G.age>=18)L.push({l:'Car dealership',s:'Buy a car with cash or a bank loan',go:carShop});
  if(G.age>=18)L.push({l:'Real estate',s:'Buy a home (age 22+)',go:houseShop});
  if(G.age>=18)L.push({l:'Visit the auction house',s:'Bid on 3 lots. Uses 1 activity.',dis:!(G.ap>0),go:function(){G.ap--;auction()}});
  if(false)L.push({l:'Buy a car',s:'$18,000 loan, $150/month upkeep',go:function(){if(chance(bankP(18000))){G.debt+=18000;G.car=1;result('The bank approved your car loan. You bought a car.',{happy:5})}else result('The bank declined your car loan.',{happy:-2})}});
  if(false)L.push({l:'Buy a house',s:'$250,000 with $50,000 down. Needs the cash.',dis:G.money<50000,go:function(){if(chance(bankP(100000))){G.money-=50000;G.house=1;G.homeVal=250000;G.mort=200000;result('The bank approved your mortgage. You bought a house.',{happy:8})}else result('The bank declined your mortgage application.',{happy:-3})}});
  if(false)L.push({l:'Sell your house',s:'Equity: '+fmt(G.homeVal-G.mort),go:function(){var e=G.homeVal-G.mort;if(e>=0)G.money+=e;else spend(-e);G.house=0;G.homeVal=0;G.mort=0;result('You sold your house.',{})}});
  if(G.job)L.push({l:'Quit your job',go:function(){G.job=null;G.salary=0;G.track=null;result('You quit your job.',{happy:3})}});
  if(G.debt>0)L.push({l:'Watch an ad to clear $5,000 of debt',go:function(){AdBridge.showRewarded(function(ok){if(ok){G.debt=Math.max(0,G.debt-5000);say('A sponsor cleared $5,000 of your debt.');$('modal').classList.remove('on');render();save()}})}});
  if(G.debt>0)L.push({l:'Pay down debt',s:'Choose how much to pay. Debt: '+fmt(G.debt),dis:G.money<1,go:payDebtPage});
  ask('Activities',u?'You are out of activities this turn.':'Pick an activity. You have '+G.ap+' left before you age up.',L);
}

/* ---------- render ---------- */
function where(){
  if(G.jail>0)return(G.age<18?'Juvenile detention':'In prison')+' · '+G.jail+' months left';
  if(G.college)return G.college.name+', year '+(Math.floor(G.cm/12)+1)+' · GPA '+G.gpa.toFixed(2);
  if(G.k12)return(G.grade===0?'Kindergarten':ord(G.grade)+' grade')+' · GPA '+G.gpa.toFixed(2);
  if(G.retired)return'Retired';
  return G.job||(G.age<5?'Baby':G.age<18?'Child':'Unemployed');
}
function render(){
  $('name').textContent=G.name;
  $('money').innerHTML=fmt(G.money)+(G.debt>0?'<br><small class="dn">Debt '+fmt(G.debt)+'</small>':'')+(G.house?'<br><small>Home equity '+fmt(G.homeVal-G.mort)+'</small>':'');
  $('meta').textContent='Age '+G.age+' · '+MO[G.month]+' · '+where();
  $('stats').innerHTML=STATS.map(function(s){return'<div class="st">'+s[1]+'<div class="bar"><i style="width:'+G[s[0]]+'%;background:var('+s[2]+')"></i></div></div>'}).join('');
  var gs=[],cur=null;
  G.log.slice(0,250).forEach(function(l){
    if(!cur||cur.a!==l.a||cur.m!==l.m){cur={a:l.a,m:l.m,L:[]};gs.push(cur)}
    cur.L.unshift(l.t);
  });
  $('log').innerHTML=gs.map(function(g){return'<div class="yr">AGE '+g.a+' · '+MO[g.m].toUpperCase()+'</div>'+g.L.map(function(t){return'<p class="ln">'+t+'</p>'}).join('')}).join('');
  $('nw').textContent='News'+(G.unread?' ('+G.unread+')':'');
  $('age').disabled=!G.alive;
}
$('nl').onclick=function(){
  if(busy())return;
  if(!G||!G.alive){newLife();return}
  ask('Start a new life?','Your current life will end and cannot be recovered.',[
    {l:'Yes, start a new life',go:function(){AdBridge.showInterstitial();if(G.age>best){best=G.age;try{localStorage.setItem('ll_best',best)}catch(e){}}newLife()}},
    {l:'Cancel',go:function(){$('modal').classList.remove('on')}}
  ]);
};
$('age').onclick=ageUp;$('act').onclick=activities;$('set').onclick=settingsPage;$('inv').onclick=invPage;$('nw').onclick=newsPage;$('ppl').onclick=people;$('skl').onclick=skillsPage;
if(G&&G.alive){G.debt=G.debt||0;if(G.ap==null)G.ap=3;if(G.car&&!(G.inv||[]).some(function(i){return i.type==='car'})){G.inv=G.inv||[];G.inv.push({type:'car',name:'Your car',paid:18000,val:12000,up:150})}G.car=0;if(G.house&&!G.hname){G.hname='Your house';G.hup=0}G.homeVal=G.homeVal||0;G.mort=G.mort||0;G.traits=G.traits||[];G.ed=G.ed||'none';if(G.money<0){G.debt+=-G.money;G.money=0}render()}else newLife();
</script>
</body>
